; ---------------------------------------------------------------------------
; Guition JC3248W535 (ESP32-S3 N16R8, 3.5" 320x480 AXS15231B QSPI LCD)
; + external EBYTE E22-900M30S (SX1262 + 1 W PA)
;
; Wiring of the E22 (see variants/jc3248w535/WIRING.md):
;   P2 connector : IO6=SCK  IO7=MOSI  IO15=MISO  IO16=BUSY  IO9=DIO1  IO14=RXEN
;   P3 connector : IO17=NSS IO18=NRST, GND = common ground
;   E22 TXEN is tied to E22 DIO2 on the module (DIO2 drives the TX switch).
;   IO5 (battery divider on the board) and IO46 (strapping pin) are NOT used.
; ---------------------------------------------------------------------------

[JC3248W535]
extends = esp32_base
board = jc3248w535
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -I variants/jc3248w535
  ; make U8g2 visible to every library (Arduino_GFX enables its UTF-8 font
  ; renderer only via __has_include(<U8g2lib.h>), so all units must agree)
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/U8g2/src
  -D JC3248W535
  ; ---- on-board I2C (touch controller bus, internal) ----
  ; Must be set explicitly: the ESP32-S3 Arduino default Wire pins are
  ; SDA=8/SCL=9, and IO9 is used here for the radio DIO1.
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=8
  ; ---- battery: P5 -> divider R26 33k / R27 100k -> IO5 (ADC1) ----
  -D PIN_VBAT_READ=5
  -D VBAT_DIV_NUM=133
  -D VBAT_DIV_DEN=100
  ; ---- LCD: AXS15231B over QSPI ----
  -D PIN_TFT_CS=45
  -D PIN_TFT_SCK=47
  -D PIN_TFT_D0=21
  -D PIN_TFT_D1=48
  -D PIN_TFT_D2=40
  -D PIN_TFT_D3=39
  -D PIN_TFT_BL=1
  -D DISPLAY_HAS_SPLASH
  ; ---- E22-900M30S (SX1262) ----
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_SCLK=6
  -D P_LORA_MOSI=7
  -D P_LORA_MISO=15
  -D P_LORA_BUSY=16
  -D P_LORA_DIO_1=9
  -D P_LORA_NSS=17
  -D P_LORA_RESET=18
  -D SX126X_RXEN=14
  -D SX126X_TXEN=RADIOLIB_NC        ; TXEN is driven by DIO2 on the module
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; E22-900M30S: 20 dBm into the PA -> ~30 dBm out. Higher values distort
  ; the PA output (same limit as the other E22-900M30S boards in MeshCore).
  -D LORA_TX_POWER=20
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/jc3248w535>
lib_deps =
  ${esp32_base.lib_deps}
  moononournation/GFX Library for Arduino @ 1.6.0
  ; needed by Arduino_GFX for UTF-8 / Cyrillic text (font u8g2_font_10x20_t_cyrillic)
  olikraus/U8g2 @ ^2.35.19

; ---- Wi-Fi ----
; Configured on the device (page 3 "Interfaces"): network or own access
; point, DHCP or static IP, TCP port. Optional defaults until something is
; saved there, e.g. in platformio.local.ini:
;   [env:JC3248W535_companion_radio_ble_usb_wifi]
;   build_flags = ${...} -D JC3248_WIFI_SSID='"MyNetwork"' -D JC3248_WIFI_PWD='"secret"'

; ---- Companion radio: Bluetooth (BLE) + USB + Wi-Fi at the same time ----
; Every client (phone over BLE, PC over USB, server over Wi-Fi TCP port 5000)
; can stay connected simultaneously; replies go to the client that asked,
; pushes and received messages go to all of them.
[env:JC3248W535_companion_radio_ble_usb_wifi]
extends = JC3248W535
build_flags =
  ${JC3248W535.build_flags}
  -I examples/companion_radio/ui-jc3248
  -D ENABLE_USB_INTERFACE
  -D TCP_PORT=5000
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=AXS15231BDisplay
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${JC3248W535.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-jc3248/*.cpp>
lib_deps =
  ${JC3248W535.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---- Same firmware + diagnostic log on the USB serial monitor (115200) ----
; Waits 5 s after reset so the monitor can attach before the radio is
; initialised, then logs radio init status and every TX attempt.
; USB carries the log here, so there is no USB companion interface (BLE + Wi-Fi only).
[env:JC3248W535_companion_radio_ble_wifi_debug]
extends = JC3248W535
build_flags =
  ${JC3248W535.build_flags}
  -I examples/companion_radio/ui-jc3248
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=AXS15231BDisplay
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D JC3248_DEBUG_BOOT_WAIT_MS=5000
  -D WIFI_DEBUG_LOGGING=1
build_src_filter = ${JC3248W535.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-jc3248/*.cpp>
lib_deps =
  ${JC3248W535.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---- Transmitter test (not a MeshCore node) ----
; Sends 255-byte LoRa packets back to back / at 10 % / 1 % duty, power and
; profile set on the screen, stops by itself after 3 minutes. Own sync word,
; MeshCore nodes don't receive it. Only with an antenna; continuous
; transmission exceeds the 868 MHz duty-cycle limits - keep tests short.
[env:JC3248W535_tx_test]
extends = JC3248W535
build_flags =
  ${JC3248W535.build_flags}
  -I examples/companion_radio/ui-jc3248
  -I examples/tx_test
  -D DISPLAY_CLASS=AXS15231BDisplay
build_src_filter = ${JC3248W535.build_src_filter}
  +<../examples/tx_test/*.cpp>
  +<../examples/companion_radio/ui-jc3248/UIGfx.cpp>
  +<../examples/companion_radio/ui-jc3248/UIStyle.cpp>
  +<../examples/companion_radio/ui-jc3248/UIScreens.cpp>
  +<../examples/companion_radio/ui-jc3248/UIChats.cpp>
  +<../examples/companion_radio/ui-jc3248/UIInterfaces.cpp>
  +<../examples/companion_radio/ui-jc3248/UIRepeater.cpp>
